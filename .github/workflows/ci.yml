name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-for-tests
      DATABASE_URL: sqlite:///./ci-test.db
      LLM_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  agent-security-eval:
    name: Agent security eval
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      ENVIRONMENT: test
      SECRET_KEY: ci-only-secret-key-for-tests
      DATABASE_URL: sqlite:///./ci-test.db
      LLM_API_KEY: ci-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt
      # 独立强制门禁:安全断言失败即阻断,不使用人工模型质量评价替代
      - run: >-
          python -m pytest -q
          tests/test_agent_eval.py
          tests/test_security_boundary.py
          tests/test_notifications.py
          tests/test_agent_data_api.py
          tests/test_agent_planner.py
          tests/test_tool_contract.py

  frontend:
    name: Frontend tests and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
